<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Data Cucian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/app.js"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex">
      <!-- SIDEBAR -->
      <div class="w-64 bg-white h-screen p-4 shadow">
        <h1 class="text-xl font-bold mb-6">Laundry Connect</h1>

        <div class="space-y-2">
          <a href="index.html" class="block p-2 rounded hover:bg-gray-100"
            >Dashboard</a
          >
          <a
            href="data-cucian.html"
            class="block p-2 rounded bg-blue-100 text-blue-600"
            >Data Cucian</a
          >
          <a href="#" class="block p-2 rounded hover:bg-gray-100">Keuangan</a>
          <a href="#" class="block p-2 rounded hover:bg-gray-100">Pengaturan</a>
        </div>
      </div>

      <div id="modalCucian" class="hidden fixed inset-0 z-50 flex items-center justify-center">
  <div onclick="closeCucian()" class="absolute inset-0 bg-black/40"></div>

  <div class="relative bg-white w-full max-w-2xl rounded-2xl shadow-lg p-6">
    <h2 class="text-xl font-bold mb-4">Tambah Cucian Baru</h2>

    <input placeholder="Nama Pelanggan" class="w-full mb-3 p-3 border rounded-xl" />
    <input placeholder="No WhatsApp" class="w-full mb-3 p-3 border rounded-xl" />
    <input placeholder="Berat" class="w-full mb-3 p-3 border rounded-xl" />
    <input placeholder="Harga" class="w-full mb-3 p-3 border rounded-xl" />

    <div class="flex justify-end gap-2">
      <button onclick="closeCucian()">Batal</button>
      <button class="bg-teal-600 text-white px-4 py-2 rounded-xl">Simpan</button>
    </div>
  </div>
</div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 p-6">
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold">Manajemen Laundry</h2>

          <button
            onclick="openCucian()"
            class="bg-teal-600 text-white px-4 py-2 rounded-lg shadow"
          >
            + Cucian Baru
          </button>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="flex gap-4 mb-4">
          <input
            type="text"
            placeholder="Cari No. Laundry atau Nama..."
            class="border rounded-lg px-4 py-2 w-1/3"
          />

          <select class="border rounded-lg px-4 py-2">
            <option>Semua Status</option>
            <option>Menunggu</option>
            <option>Dicuci</option>
            <option>Selesai</option>
            <option>Sudah Diambil</option>
          </select>
        </div>

        <!-- TABLE -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-gray-100">
              <tr class="text-left">
                <th class="p-3">No. Laundry</th>
                <th class="p-3">Nama Pelanggan</th>
                <th class="p-3">Status</th>
                <th class="p-3">Biaya</th>
                <th class="p-3">Aksi</th>
              </tr>
            </thead>

            <tbody id="tbodyTransaksi">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
